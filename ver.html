<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Solicitud — Crédito Villarreal</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#F5F5F5;color:#111}
    .header{background:#075E54;color:white;padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .header-icon{font-size:32px}
    .header-title{font-size:18px;font-weight:800}
    .header-sub{font-size:12px;opacity:.75;margin-top:2px}
    .body{max-width:700px;margin:0 auto;padding:16px}
    .card{background:white;border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .card-title{padding:10px 16px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid #F0F0F0}
    .card-body{padding:14px 16px}
    .row{display:flex;gap:8px;margin-bottom:7px;align-items:baseline}
    .lbl{color:#888;font-size:12px;min-width:140px;flex-shrink:0}
    .val{font-weight:600;font-size:13px;word-break:break-word}
    .score-card{border-radius:14px;padding:16px;margin-bottom:14px;border:2px solid #ddd}
    .score-num{font-size:36px;font-weight:900;float:right}
    .score-title{font-size:20px;font-weight:800}
    .tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;margin:2px}
    .tag-g{background:#E8F5E9;color:#2E7D32}
    .tag-r{background:#FFEBEE;color:#B71C1C}
    .doc-img{width:100%;max-width:500px;border-radius:10px;border:1px solid #eee;display:block;margin-top:8px}
    .doc-pdf{background:#F3F4F6;border-radius:10px;padding:12px 16px;font-size:13px;color:#555;display:flex;align-items:center;gap:8px;margin-top:8px}
    .alert-box{background:#FFF8E1;border:1.5px solid #FFB300;border-radius:10px;padding:12px 16px;margin-bottom:14px}
    .alert-title{font-weight:700;color:#E65100;font-size:13px;margin-bottom:6px}
    .info-box{background:#E3F2FD;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#1565C0}
    .loading{text-align:center;padding:60px 20px;color:#888}
    .error{text-align:center;padding:40px 20px;color:#B71C1C}
    .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
    img.doc-img{cursor:pointer}
    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center;flex-direction:column}
    .lightbox.open{display:flex}
    .lightbox img{max-width:95vw;max-height:90vh;border-radius:8px}
    .lightbox-close{position:absolute;top:16px;right:16px;color:white;font-size:28px;cursor:pointer;background:rgba(255,255,255,.15);border:none;border-radius:50%;width:40px;height:40px}
    @media(max-width:600px){.lbl{min-width:110px}}
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">🏠</div>
  <div>
    <div class="header-title">Crédito Villarreal</div>
    <div class="header-sub">Expediente de Solicitud</div>
  </div>
</div>

<div class="body">
  <div id="content"><div class="loading">⏳ Cargando expediente...</div></div>
</div>

<!-- Lightbox para ver fotos grandes -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('open')">✕</button>
  <img id="lightbox-img" src="" alt=""/>
</div>

<script>
function openLightbox(src){ document.getElementById('lightbox-img').src=src; document.getElementById('lightbox').classList.add('open'); }

const params = new URLSearchParams(window.location.search);
const id = params.get('id');

if(!id){
  document.getElementById('content').innerHTML = '<div class="error">❌ No se especificó un ID de solicitud.</div>';
} else {
  fetch(`/get-app?id=${id}`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(renderApp)
    .catch(err => {
      document.getElementById('content').innerHTML =
        err === 404
          ? '<div class="error">❌ Solicitud no encontrada. Puede haber expirado (30 días).</div>'
          : `<div class="error">❌ Error al cargar. Código: ${err}</div>`;
    });
}

function semColor(s){ return {verde:'#2E7D32',amarillo:'#E65100',rojo:'#B71C1C'}[s]||'#333'; }
function semBg(s){ return {verde:'#E8F5E9',amarillo:'#FFF8E1',rojo:'#FFEBEE'}[s]||'#F5F5F5'; }
function semIcon(d){ return {APROBADO:'✅',EN_REVISION:'⚠️',RECHAZADO:'❌'}[d]||'🔍'; }
function docLabel(t){ return {ine_front:'INE — Frente',ine_back:'INE — Reverso',income_proof:'Comprobante de Ingresos',address_proof:'Comprobante de Domicilio'}[t]||t; }

function row(label, value){
  if(!value) return '';
  return `<div class="row"><span class="lbl">${label}</span><span class="val">${value}</span></div>`;
}

function renderApp(data){
  const x = data.appData || data;
  const score = data.creditScore;
  const store = data.store;
  const docs = data.docs || data.docPreviews || [];
  const now = new Date(data.savedAt||Date.now()).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});

  let html = '';

  // Info bar
  html += `<div class="info-box">📅 Solicitud generada: <strong>${now}</strong>${store?` &nbsp;|&nbsp; 🏪 Tienda: <strong>${store.name}</strong>`:''}
    &nbsp;|&nbsp; 🔑 ID: <strong>${id}</strong></div>`;

  // Alertas
  const alertas = [];
  if(x.needsEnganche) alertas.push('REQUIERE 10% DE ENGANCHE');
  if(x.hasRezago) alertas.push('CON REZAGO — validar en tienda');
  if(x.gender==='Hombre'||(x.age&&(x.age<=22||x.age>=70))) alertas.push('REQUIERE AVAL EN TIENDA');
  if(score?.alertas?.length) score.alertas.forEach(a=>alertas.push(a));

  if(alertas.length){
    html += `<div class="alert-box"><div class="alert-title">⚠️ ALERTAS IMPORTANTES</div>
      ${alertas.map(a=>`<div style="font-size:13px;margin-bottom:3px">• ${a}</div>`).join('')}
    </div>`;
  }

  // Score card
  if(score){
    const c = semColor(score.semaforo), bg = semBg(score.semaforo);
    html += `<div class="score-card" style="border-color:${c};background:${bg}">
      <div class="score-num" style="color:${c}">${score.puntaje}<span style="font-size:16px">/100</span></div>
      <div class="score-title" style="color:${c}">${semIcon(score.decision)} DICTAMEN IA: ${(score.decision||'').replace('_',' ')}</div>
      <p style="margin:8px 0 10px;font-size:13px;color:#333;line-height:1.5">${score.resumen||''}</p>
      ${score.recomendacion_linea?`<div style="font-size:13px;font-weight:700;color:${c};margin-bottom:8px">💳 ${score.recomendacion_linea}</div>`:''}
      ${score.fortalezas?.length?`<div>${score.fortalezas.map(f=>`<span class="tag tag-g">✅ ${f}</span>`).join('')}</div>`:''}
      ${score.alertas?.length?`<div style="margin-top:6px">${score.alertas.map(a=>`<span class="tag tag-r">⚠️ ${a}</span>`).join('')}</div>`:''}
    </div>`;
  }

  // Datos del cliente
  html += `<div class="card"><div class="card-title" style="background:#E8F5E9;color:#075E54">👤 Datos del Cliente</div><div class="card-body">
    ${row('Tipo',x.type==='new'?'<span class="badge" style="background:#E3F2FD;color:#1565C0">Cliente Nuevo</span>':'<span class="badge" style="background:#FFF8E1;color:#E65100">Cliente Preferente</span>')}
    ${row('No. Cliente',x.customerId)}
    ${x.nombres?row('Nombre(s)',x.nombres):row('Nombre',x.name)}
    ${row('Apellido Paterno',x.apellido_paterno)}
    ${row('Apellido Materno',x.apellido_materno)}
    ${row('Fecha Nacimiento',x.dob)}
    ${row('CURP',x.curp)}
    ${row('Edad',x.age?x.age+' años':null)}
    ${row('Género',x.gender)}
    ${row('Estado Civil',x.civilStatus)}
    ${row('Teléfono',x.phone)}
  </div></div>`;

  // Domicilio
  const domActual = x.location?.street ? `${x.location.street}${x.location.colonia?', Col. '+x.location.colonia:''}${x.location.city?', '+x.location.city:''}` : x.address;
  if(x.ine_address||domActual){
    html += `<div class="card"><div class="card-title" style="background:#E8F5E9;color:#075E54">🏠 Domicilio</div><div class="card-body">
      ${row('Domicilio en INE',x.ine_address)}
      ${x._addressChanged?row('Domicilio Actual',domActual):(!x.ine_address?row('Domicilio',domActual):'')}
      ${row('Tipo de domicilio',x.propertyType)}
    </div></div>`;
  }

  // Económico
  html += `<div class="card"><div class="card-title" style="background:#E8F5E9;color:#075E54">💼 Situación Económica</div><div class="card-body">
    ${row('Ingresos declarados',x.incomeRange)}
    ${row('Monto en documento',x.incomeAmount)}
    ${row('Comprobantes ingresos',x.mesesCubiertos?x.mesesCubiertos+'/3 meses':null)}
    ${row('Estabilidad laboral',x.stability)}
    ${row('Producto de interés',x.product)}
  </div></div>`;

  // Referencias
  if(x.ref1){
    html += `<div class="card"><div class="card-title" style="background:#E8F5E9;color:#075E54">📞 Referencia 1</div><div class="card-body">
      ${row('Nombre',x.ref1.name+' '+x.ref1.apellidos)}
      ${row('Parentesco',x.ref1.parentesco)}
      ${row('Teléfono',`<a href="tel:${x.ref1.phone}">${x.ref1.phone}</a>`)}
    </div></div>`;
  }
  if(x.ref2){
    html += `<div class="card"><div class="card-title" style="background:#E8F5E9;color:#075E54">📞 Referencia 2</div><div class="card-body">
      ${row('Nombre',x.ref2.name+' '+x.ref2.apellidos)}
      ${row('Parentesco',x.ref2.parentesco)}
      ${row('Teléfono',`<a href="tel:${x.ref2.phone}">${x.ref2.phone}</a>`)}
    </div></div>`;
  }

  // Documentos
  if(docs.length){
    html += `<div class="card"><div class="card-title" style="background:#E8F5E9;color:#075E54">📎 Documentos Verificados con IA</div><div class="card-body">`;
    docs.forEach(doc=>{
      const isImg = doc.mediaType && doc.mediaType.startsWith("image/");
      const docUrl = doc.binId ? `/get-doc?id=${doc.binId}` : null;
      html += `<div style="margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #f0f0f0">
        <div style="font-weight:700;font-size:13px;color:#075E54;margin-bottom:3px">✅ ${docLabel(doc.type)}</div>
        <div style="font-size:11px;color:#888;margin-bottom:8px">${doc.name}</div>`;
      if(docUrl && isImg){
        html += `<img class="doc-img" src="${docUrl}" alt="${doc.name}" onclick="openLightbox(this.src)" title="Toca para ampliar" style="max-height:280px;cursor:pointer"/>
        <br/><a href="${docUrl}" download="${doc.name}" style="display:inline-block;margin-top:6px;font-size:12px;color:#1565C0;font-weight:700;background:#E3F2FD;padding:4px 12px;border-radius:8px">⬇ Descargar imagen</a>`;
      } else if(docUrl){
        html += `<div class="doc-pdf" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span>📄 ${doc.name}</span>
          <a href="${docUrl}" target="_blank" download="${doc.name}" style="background:#1565C0;color:#fff;font-weight:700;font-size:12px;padding:6px 14px;border-radius:8px;text-decoration:none;white-space:nowrap;flex-shrink:0">⬇ Descargar PDF</a>
        </div>`;
      } else {
        html += `<div class="doc-pdf" style="color:#888">📎 ${doc.name}</div>`;
      }
      html += `</div>`;
    });
    html += `</div></div>`;
  }

  
  html += `<div style="text-align:center;padding:16px;color:#aaa;font-size:12px">
    Crédito Villarreal — Expediente ID: ${id} — Válido 30 días
  </div>`;

  document.getElementById('content').innerHTML = html;
}
</script>
</body>
</html>
