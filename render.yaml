services:
  - type: web
    name: credito-villarreal-bot
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: ANTHROPIC_KEY
        sync: false
      - key: JSONBIN_KEY
        sync: false
      - key: HISTORY_BIN
        sync: false
      - key: SITE_URL
        sync: false
    disk:
      name: auth-data
      mountPath: /opt/render/project/src/auth_info_baileys
      sizeGB: 1
